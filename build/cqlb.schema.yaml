  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    helper: "^help$"
    i_reverse_lookup_pattern: "^i.[a-z]+$"
    mkst: "^[a-z]*`[a-z`]*$"
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"
    veng: "^'.*$"
    zhuyin_fix: "~[a-z]*?$"
schema:
  author:
    - "付东升"
  dependencies:
    - english
  description: |
    超强两笔。按 i 键临时拼音或者用拼音反查编码

  name: "超强两笔"
  schema_id: cqlb
  version: 1.0
simplifier:
