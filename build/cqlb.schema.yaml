    - "derive/^(i.*[ie]n)g(.*$)/$1$2/"
    - "derive/^(i.*[ie]n)([^g].*$)/$1g$2\t1/"
  alphabet: "abcdefghijklmnopqrstuvwxyz;,./"
  auto_clear: max_length
  auto_select: true
  delimiter: "`"
  initials: abcdefghijklmnopqrstuvwxyz
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  - name: full_shape
