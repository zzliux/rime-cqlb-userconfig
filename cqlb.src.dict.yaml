---
name: cqlb.src
version: "1.0"
sort: by_weight
columns:
  - text
  - code
  - weight
  - stem
encoder:
  exclude_patterns:
    - '^[iuv].*$|[ao]$'
  rules:
    - length_equal: 2
      formula: "AaAbBaBb"
    - length_equal: 3
      formula: "AaAbBaCa"
    - length_in_range: [4, 300]
      formula: "AaBaCaZa"
import_tables:
  - cqlb        #主码表
  - ipinyin     #反查副码表
#  - A           #示例A副码表
#  - B           #示例B副码表
#  - C           #示例C副码表
#注:申明副码表后却无文件会卡死
...
#❶本文件为超强快码 Rime 平台用户词库，下称「源词库」
#❷源词库意义：意使跨平台 Rime 输入法引擎用有且仅有一个的用户词库打通 Win/Linux/Android/Ios/Mac 等主流手机和PC端；不对初始词库做修改就并存用户自加词,实现用户词库与原词库1+1=1的效果，一份用户码表走天下。
#❸本方案的初始码表实为源词库的下属扩展词库，初始码表名为：cqkm.dict.yaml。初始码表与此码表后缀可视为“.dict.yaml”，由utf-8文本格式直接更改后缀而成。
#❹任一词条前加“#”号可使其失效，标志其后内容仅起注释及解释代码的作用。

#❺请注意！码表会用到Tab制表符以切分编码与字词，Tab制表符不显示，视觉上与空格相似，但空格不生效不可以使用空格，请注意区别Tab和空格。若想使用Tab制表符，可以复制此重括号中的使用→【	】

#❻往下可逐行加入带有编码的用户自加字词，一个词条占一行，行末尾不可有符号。格式为：
#“词组+Tab+编码”
  #①当编码为原词库中空码时则四码上屏；
  #②当编码与原词库重码时则自加词居后；
  #③若欲使与原词库重码时自加词居于前，格式为：
#“词组+Tab+编码+Tab+1”

#示例：

#例	dhsl
#↑“例”居dhsl编码最后(去掉上行#号生效)
#例	dhsl	1
#↑“例”在dhsl编码最前，调频(去掉上行#号生效)

#❼Rime平台下加词可无编码进行：每词条独占一行，词库会在部署后自动为没有编码的词条编码。例如下两句诗并未编码也可被打出：

春眠不觉晓处处闻啼鸟
夜来风雨声花落知多少

#欲使无编码所加词条与下属初始码表重码时居于前，应使用“词条+Tab+Tab+1”格式。例如：

#倒时		1
#↑“倒时”自动编码后会居该编码首位(去掉上行#号生效)


      #功能详解：
#⑴:无编码词条放入此词库保存后重新部署该词条即会被后台自动编码，即可以使用方案规则打出。
#⑵:缺点是含多音字的词组用其另一音的方式也可打出该词，利大于弊，应避免含多音字词条的选入。
#⑶:长词规则为前三字音加末字音，所以末尾有句号时无法被自动编码，反之可以：

春眠不觉晓，处处闻啼鸟；夜来风雨声，花落知多少

#⑷:初始码表实为源词库的下属扩展词库，如有庞大的专业或系列词库需要无编码加词，可效仿初始词库将其单独以扩展方式挂接在源词库之下。方法：
#　　㈠:挂接某专业词条库A，命名其为“A.dict.yaml”并使之与源词库在同一文件夹内。

#　　㈡:在源词库表头“import_tables”下删除A列前井号，即申明A词库为用户词库中的下属挂接词库。

#　　㈢:码表必须有表头，例如源词库本身：以“---”示意表头开始、以“...”表示表头结束。复制下示5行格式文本内容并将“XXX”更改为“A”并删除前面的井号作为A专业词库的表头，表头下为无编码词条。重新部署即完成挂接。

#---
#name: XXX
#version: "2.0"
#sort: by_weight
#...

#需要注意的是，在源词库的import_tables下面申明下属词库后却无词库，则程序可能卡死;如去掉源词库import_tables下属的B示例词库前的井号则表示需要使用“B.dict.yaml”文件，若没有B.dict.yaml文件则程序卡死。

#⑸:微调初始码表中的排序，话不多说，直接看示例：
#原初始码表这个编码的排序：
#喊叫	hgjg
#呼叫	hgjg
#吼叫	hgjg
#嚎叫	hgjg

#调整后(去掉#号生效)：
#吼叫	hgjg
#喊叫	hgjg
#呼叫	hgjg
#嚎叫	hgjg

#如上述皆无法满足需求，必然是属于真正的diy用户，根本无需源词库只保留自己经常改动的初始码表即可。

#数据无价，注意保存备份，可以定期保存，程序升级前，可以先取出，再覆盖回去

日期	date
